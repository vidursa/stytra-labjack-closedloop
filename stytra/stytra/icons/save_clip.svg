<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- stytra v2: "save last-N-seconds clip" button. A video frame with a
     download arrow, deliberately distinct from rewind.svg (two triangles). -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 16.933333 16.933334"
   version="1.1"
   id="svg_save_clip">
  <g id="layer1">
    <!-- video frame outline -->
    <rect
       x="1.6" y="2.4" width="13.73" height="12.13" rx="1.4" ry="1.4"
       style="fill:#000000;fill-opacity:0;stroke:#7ad6a0;stroke-width:1.05833334;stroke-linejoin:round;stroke-opacity:1" />
    <!-- sprocket holes, left and right, to read as 'video/film' -->
    <rect x="2.55" y="3.5"  width="0.9" height="0.9" style="fill:#7ad6a0" />
    <rect x="2.55" y="8.05" width="0.9" height="0.9" style="fill:#7ad6a0" />
    <rect x="2.55" y="12.6" width="0.9" height="0.9" style="fill:#7ad6a0" />
    <rect x="13.48" y="3.5"  width="0.9" height="0.9" style="fill:#7ad6a0" />
    <rect x="13.48" y="8.05" width="0.9" height="0.9" style="fill:#7ad6a0" />
    <rect x="13.48" y="12.6" width="0.9" height="0.9" style="fill:#7ad6a0" />
    <!-- download / save arrow shaft -->
    <rect x="7.71" y="4.1" width="1.5" height="4.05" style="fill:#ffffff" />
    <!-- arrow head -->
    <path d="M 6.36 7.7 L 10.56 7.7 L 8.46 10.7 Z" style="fill:#ffffff" />
    <!-- save tray / base line -->
    <rect x="4.7" y="11.7" width="7.53" height="0.95" rx="0.3" ry="0.3" style="fill:#ffffff" />
  </g>
</svg>
