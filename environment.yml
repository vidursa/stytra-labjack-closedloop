# Conda environment for the closed-loop tail-bend -> LabJack experiment.
#
#   conda env create -f environment.yml
#   conda activate tailbend-cl
#   pip install -e ./stytra          # vendored stytra (this repo)
#   pip install -r requirements.txt  # av / opencv / LabJackPython / matplotlib
#
# stytra pins to old numba / PyQt5, so Python must be 3.7-3.9. 3.8 is the
# safest choice. PyQt5 installs more reliably from conda than from pip on
# Windows, which is why it is listed here rather than in requirements.txt.
name: tailbend-cl
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pyqt=5
  - numpy
  - pip
